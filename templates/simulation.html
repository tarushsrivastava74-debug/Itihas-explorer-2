<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITIHAS — Interactive Historical Roleplay Engine</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #070a12;
      --panel-dark: #0d1424;
      --card-inner: #131d33;
      --surface-card: #0f172a;
      --nav-bg: #050811;
      --border-subtle: #1e293b;
      --border-hover: #334155;

      --amber-500: #f59e0b;
      --amber-600: #d97706;
      --amber-glow: rgba(245, 158, 11, 0.3);
      --sky-400: #38bdf8;
      --emerald-400: #10b981;
      --crimson-500: #ef4444;

      --text-white: #ffffff;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --radial-1: rgba(217, 119, 6, 0.08);
      --radial-2: rgba(56, 189, 248, 0.06);

      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="light"] {
      --bg-dark: #f8fafc;
      --panel-dark: #ffffff;
      --card-inner: #f1f5f9;
      --surface-card: #e2e8f0;
      --nav-bg: #e2e8f0;
      --border-subtle: #cbd5e1;
      --border-hover: #94a3b8;

      --text-white: #0f172a;
      --text-main: #1e293b;
      --text-muted: #475569;
      --text-dim: #64748b;

      --radial-1: rgba(245, 158, 11, 0.12);
      --radial-2: rgba(56, 189, 248, 0.08);
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-stack);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 20%, var(--radial-1) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, var(--radial-2) 0%, transparent 45%);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      width: 100%;
      height: 64px;
      background: var(--panel-dark);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(12px);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand-badge {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--amber-500), var(--amber-600));
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      box-shadow: 0 2px 10px var(--amber-glow);
    }

    .brand-text {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-white);
    }

    .brand-text span {
      color: var(--amber-500);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-left: 5px;
    }

    nav.nav-bar {
      display: flex;
      background: var(--nav-bg);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      gap: 2px;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nav-item:hover {
      color: var(--text-white);
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-item.active {
      background: var(--amber-600);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--amber-glow);
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-pill {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .theme-pill:hover {
      border-color: var(--amber-500);
      color: var(--text-white);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 12px;
      border-left: 1px solid var(--border-subtle);
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--amber-500), #ef4444);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    .simulation-workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      padding: 20px 24px;
      overflow: hidden;
    }

    .scenario-sidebar {
      background: var(--panel-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      overflow-y: auto;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--amber-500);
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .scenario-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--text-white);
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .scenario-era {
      font-size: 12px;
      font-family: monospace;
      color: var(--sky-400);
      font-weight: 700;
      margin-bottom: 14px;
      display: block;
    }

    .scenario-premise {
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .state-metrics-box {
      background: var(--card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .metric-row:last-child {
      margin-bottom: 0;
    }

    .metric-label {
      color: var(--text-dim);
    }

    .metric-val {
      font-weight: 700;
      color: var(--text-white);
    }

    .restart-btn {
      width: 100%;
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .restart-btn:hover {
      background: var(--nav-bg);
      border-color: var(--amber-500);
      color: var(--text-white);
    }

    .narrative-viewport {
      background: var(--panel-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .chronicle-log {
      flex: 1;
      overflow-y: auto;
      padding-right: 12px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .log-node {
      border-left: 3px solid var(--amber-500);
      padding-left: 14px;
    }

    .log-turn-tag {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--amber-500);
      margin-bottom: 4px;
      display: block;
    }

    .log-narrative-text {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-main);
    }

    .log-choice-made {
      margin-top: 8px;
      font-size: 12px;
      font-style: italic;
      color: var(--sky-400);
    }

    .decision-dock {
      background: var(--card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 16px;
    }

    .dock-prompt {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-white);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .choice-card-btn {
      background: var(--panel-dark);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.45;
      transition: all 0.2s ease;
    }

    .choice-card-btn:hover:not(:disabled) {
      border-color: var(--amber-500);
      background: var(--surface-card);
      color: var(--text-white);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .choice-tag {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--amber-500);
      display: block;
      margin-bottom: 3px;
    }

    @media (max-width: 900px) {
      nav.nav-bar { display: none; }
      .simulation-workspace { grid-template-columns: 1fr; }
      .options-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-theme="dark">

  <header>
    <a href="/" class="brand-link"><svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="ITIHAS"><path class="lg-arch" d="M 22 102 V 54 C 22 26, 98 26, 98 54 V 102" /><path class="lg-trim" d="M 32 102 V 58 C 32 38, 88 38, 88 58 V 102" /><path class="lg-base" d="M 12 102 H 108" /><path class="lg-base2" d="M 22 109 H 98" /><path class="lg-star" d="M 60 12 L 62 19 L 69 21 L 62 23 L 60 30 L 58 23 L 51 21 L 58 19 Z" /><path class="lg-i" transform="translate(46.9 80.9) scale(0.052 -0.052)" d="M333 202Q328 202 285 192Q260 186 229 186Q169 186 109.0 250.5Q49 315 49 374Q49 407 73.0 435.5Q97 464 127 464H301V520H-10V633H514V520H414V371H161Q167 340 191.0 316.5Q215 293 244 293Q273 293 302 302Q337 312 367 312Q411 312 440.0 278.5Q469 245 469 206Q469 64 343 10Q401 -50 476 -78L408 -178Q349 -141 308.0 -105.5Q267 -70 210 -12Q132 -10 87.0 17.5Q42 45 42 99Q42 141 70.5 160.5Q99 180 124.0 180.0Q149 180 170.5 172.0Q192 164 211.0 147.0Q230 130 239.0 120.5Q248 111 264 91Q298 95 326.0 117.0Q354 139 355 169Q355 202 333 202Z" /></svg><div class="brand-text"><div class="brand-title">ITIHAS</div><div class="brand-sub">EXPLORER</div></div></a>

    <nav class="nav-bar">
      <a href="homepage.html" class="nav-item">Home</a>
      <a href="universe.html" class="nav-item">Guided Journey</a>
      <a href="map_explorer.html" class="nav-item">Map Explorer</a>
      <a href="mysteries.html" class="nav-item">Mysteries of India</a>
      <a href="simulation.html" class="nav-item active">Roleplay</a>
    </nav>

    <div class="header-user">
      <button class="theme-pill" id="theme-toggle-btn" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span>
        <span id="theme-text">Dark</span>
      </button>
      <div class="user-pill">
        <div class="user-avatar">T</div>
        <span class="user-name">Tejas Pal</span>
      </div>
    </div>
  </header>

  <div class="simulation-workspace">
    <div class="scenario-sidebar">
      <div>
        <span class="status-badge">CAMPAIGN ACTIVE</span>
        <h1 class="scenario-title" id="scenario-title">Loading Campaign...</h1>
        <span class="scenario-era" id="scenario-era">Synchronizing timeline...</span>

        <p class="scenario-premise" id="scenario-premise">
          Connecting to simulation chronicle database...
        </p>

        <div class="state-metrics-box">
          <div class="metric-row">
            <span class="metric-label">Your Role</span>
            <span class="metric-val" id="metric-role">—</span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Allied Strength</span>
            <span class="metric-val" id="metric-forces">—</span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Tactical Terrain</span>
            <span class="metric-val" id="metric-terrain">—</span>
          </div>
        </div>
      </div>

      <button class="restart-btn" onclick="restartScenario()">↺ Restart Scenario</button>
    </div>

    <div class="narrative-viewport">
      <div class="chronicle-log" id="chronicle-log"></div>

      <div class="decision-dock">
        <div class="dock-prompt">
          <span id="directive-header-text">⚡ Select Your Next Strategic Directive:</span>
        </div>
        <div class="options-grid" id="options-container"></div>
      </div>
    </div>
  </div>

  <script>
    function updateThemeUI(theme) {
      document.body.setAttribute('data-theme', theme);
      const icon = document.getElementById('theme-icon');
      const text = document.getElementById('theme-text');
      if (theme === 'light') {
        icon.textContent = '☀️';
        text.textContent = 'Light';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'Dark';
      }
    }

    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('itihas_theme', newTheme);
      updateThemeUI(newTheme);
    }

    const QUIZ_KEY = {{ (quiz_key | tojson) if quiz_key is defined else "null" }}
      || new URLSearchParams(window.location.search).get('topic') 
      || new URLSearchParams(window.location.search).get('quiz_key') 
      || 'buddhism_jainism';

    let currentPath = "round1";
    let isInitialLoad = true;

    async function fetchStepData(path) {
      const response = await fetch('/get-quiz-question', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          topic: QUIZ_KEY,
          path: path
        })
      });

      if (!response.ok) {
        throw new Error(`Server returned ${response.status}: ${response.statusText}`);
      }

      return await response.json();
    }

    function appendStoryNode(title, bodyText, choiceLabel = null) {
      if (!bodyText) return;
      const logContainer = document.getElementById("chronicle-log");
      const node = document.createElement("div");
      node.className = "log-node";

      let inner = `
        <span class="log-turn-tag">${title}</span>
        <div class="log-narrative-text">${bodyText}</div>
      `;

      if (choiceLabel) {
        inner += `<div class="log-choice-made">Chosen Directive: ${choiceLabel}</div>`;
      }

      node.innerHTML = inner;
      logContainer.appendChild(node);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function renderOptions(rawOptions, endingTitle = "Historical Resolution", endingNarrative = "") {
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      let optionsList = [];
      if (Array.isArray(rawOptions)) {
        optionsList = rawOptions;
      } else if (rawOptions && typeof rawOptions === 'object') {
        optionsList = Object.entries(rawOptions).map(([key, val]) => {
          if (typeof val === 'string') {
            return { id: key, title: val, next: key };
          }
          return { id: key, ...val };
        });
      }

      if (optionsList.length === 0) {
        document.getElementById("directive-header-text").textContent = `✦ ${endingTitle || "Campaign Concluded"}`;
        optionsContainer.innerHTML = `
          <div style="grid-column: span 2; display: flex; flex-direction: column; gap: 8px; padding: 16px; font-size: 13px; color: var(--emerald-400); background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 8px; text-align: left;">
            <div style="font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; color: var(--amber-500);">Final Outcome</div>
            <div style="line-height: 1.6; color: var(--text-main);">${endingNarrative || "All tactical objectives resolved successfully."}</div>
          </div>
        `;
        return;
      }

      document.getElementById("directive-header-text").textContent = "⚡ Select Your Next Strategic Directive:";

      optionsList.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice-card-btn";
        const tag = opt.tag || opt.type || `Directive ${idx + 1}`;
        const title = opt.title || opt.text || opt.label || opt.description || "Advance";
        const nextTarget = opt.next || opt.nextStep || opt.path || opt.id;

        btn.innerHTML = `
          <span class="choice-tag">[${tag}]</span>
          ${title}
        `;
        btn.onclick = () => handleChoiceSelection(title, nextTarget);
        optionsContainer.appendChild(btn);
      });
    }

    async function loadStep(path, choiceLabel = null) {
      const optionsContainer = document.getElementById("options-container");
      
      try {
        const stepData = await fetchStepData(path);

        if (stepData.title) document.getElementById("scenario-title").textContent = stepData.title;
        if (stepData.era) document.getElementById("scenario-era").textContent = stepData.era;
        if (stepData.premise || stepData.initialNarrative) {
          document.getElementById("scenario-premise").textContent = stepData.premise || stepData.initialNarrative;
        }
        if (stepData.role) document.getElementById("metric-role").textContent = stepData.role;
        if (stepData.allies || stepData.forces) document.getElementById("metric-forces").textContent = stepData.allies || stepData.forces;
        if (stepData.terrain) document.getElementById("metric-terrain").textContent = stepData.terrain;

        const narrative = stepData.conclusion
          || stepData.ending
          || stepData.outcome
          || stepData.resolution
          || stepData.initialNarrative 
          || stepData.narrative 
          || stepData.question 
          || stepData.questionPrompt 
          || stepData.prompt 
          || stepData.story
          || "";

        const rawOptions = stepData.options 
          || stepData.choices 
          || (stepData.question && stepData.question.options) 
          || [];

        const hasNoOptions = !rawOptions || (Array.isArray(rawOptions) ? rawOptions.length === 0 : Object.keys(rawOptions).length === 0);
        const isEnding = stepData.is_end || stepData.end || hasNoOptions;

        if (isInitialLoad) {
          appendStoryNode("Prologue • Strategic Deployment", narrative);
          isInitialLoad = false;
        } else if (isEnding) {
          appendStoryNode("Epilogue • Historical Resolution", narrative, choiceLabel);
        } else {
          appendStoryNode("Directive Executed", narrative || "The campaign advances.", choiceLabel);
        }

        const endingTitle = stepData.title || stepData.endingTitle || "Historical Resolution";
        renderOptions(rawOptions, endingTitle, narrative);

      } catch (err) {
        console.error("Step execution error:", err);
        optionsContainer.innerHTML = `
          <div style="grid-column: span 2; text-align: center; padding: 10px; font-size: 13px; color: var(--crimson-500);">
            Failed to process simulation data. Check console logs.
          </div>
        `;
      }
    }

    async function handleChoiceSelection(choiceLabel, nextPath) {
      const buttons = document.querySelectorAll(".choice-card-btn");
      buttons.forEach(b => { 
        b.disabled = true; 
        b.style.opacity = "0.5"; 
      });

      currentPath = nextPath;
      await loadStep(currentPath, choiceLabel);
    }

    function restartScenario() {
      currentPath = "round1";
      isInitialLoad = true;
      document.getElementById("chronicle-log").innerHTML = "";
      loadStep(currentPath);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem('itihas_theme') || 'dark';
      updateThemeUI(savedTheme);
      loadStep(currentPath);
    });
  </script>
</body>
